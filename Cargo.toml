[workspace]
resolver = "2"
members = ["crates/o-guard", "crates/o-core", "crates/o-cli", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
# The run index (o.db). Bundled: no system SQLite to find on any PC.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The hook runs on every agent tool call: start fast, stay small.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
