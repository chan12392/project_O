name: guard

# Each PR is checked once, in the dev profile (an optimized --release build of every test
# binary took most of the run). Pushes are not checked again: the PR already tested the merge
# result, and merge-guard.yml flags direct pushes to the protected branches.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR replaces the run still going.
concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out and inspect.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its two parents (base, head).
          fetch-depth: 2
      - name: 이미 검사한 내용인지 확인
        id: same
        # Release PRs (test_2/test_1_hotfix → test_1, test_1 → main) usually carry exactly the head's
        # tree, which its own PRs already tested. Anything the base adds on top runs the full check.
        if: github.event_name == 'pull_request' && contains(fromJSON('["test_2", "test_1_hotfix", "test_1"]'), github.head_ref)
        run: |
          if git diff --quiet HEAD^2 HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::병합 결과가 ${GITHUB_HEAD_REF}와 같아 이미 검사한 내용입니다. 무거운 검사를 건너뜁니다."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.same.outputs.skip != 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.same.outputs.skip != 'true'
      - name: 프로바이더 정책 검사 (o scan)
        if: steps.same.outputs.skip != 'true'
        run: cargo run --quiet -p o-cli -- scan --all
      - name: Rust 테스트·lint
        if: steps.same.outputs.skip != 'true'
        run: |
          # The desktop shell (crate project-o) needs WebView system libraries that the CI image lacks.
          cargo test --workspace --exclude project-o
          cargo clippy --workspace --all-targets --exclude project-o -- -D warnings
      - uses: actions/setup-node@v4
        if: steps.same.outputs.skip != 'true'
        with:
          node-version: 24
      - name: 화면 로직 테스트·타입 검사
        if: steps.same.outputs.skip != 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app
          npm test
          npm run check
          npx tsc --noEmit -p app
