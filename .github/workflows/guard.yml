name: guard

# Every PR gets the full checks, in the dev profile (an optimized --release build of every test
# binary took most of the run). No step is skipped because the merge result equals the head:
# that never proved the head itself passed, and test_2 can hold PRs that were each checked alone
# but never together (ADR-0038). Pushes are not checked here; merge-guard.yml flags direct
# pushes to the protected branches, and release.yml calls this workflow before it publishes.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR replaces the run still going. The calling workflow's name is part
# of the group, so a release's call never cancels (or waits on) a PR run.
concurrency:
  group: guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out and inspect.
permissions:
  contents: read

jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: 기준 브랜치의 검사기 보존
        run: |
          cargo build --locked -p o-cli --target-dir "$RUNNER_TEMP/project-o-policy"
          mkdir -p "$RUNNER_TEMP/project-o-license/scripts" "$RUNNER_TEMP/project-o-license/app"
          cp scripts/check-licenses.mjs "$RUNNER_TEMP/project-o-license/scripts/"
          # Bootstrap only while the base predates ADR-0050; later PRs cannot replace the checker.
          if test -f scripts/check-dependencies.py; then
            cp scripts/check-dependencies.py "$RUNNER_TEMP/project-o-dependencies.py"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: 프로바이더 정책 검사 (o scan)
        run: '"$RUNNER_TEMP/project-o-policy/debug/o" scan --all'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: 라이선스 검사
        run: |
          cp app/package-lock.json "$RUNNER_TEMP/project-o-license/app/"
          cp THIRD_PARTY_LICENSES.txt "$RUNNER_TEMP/project-o-license/"
          node "$RUNNER_TEMP/project-o-license/scripts/check-licenses.mjs"
      - name: npm·Rust 공급망 검사
        run: |
          checker="$RUNNER_TEMP/project-o-dependencies.py"
          if ! test -f "$checker"; then checker=scripts/check-dependencies.py; fi
          python "$checker" "$GITHUB_WORKSPACE"
          npm run test:dependencies
      - name: Linux glib 포인터 회귀 검사 (일반·최적화)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-dev
          cargo test --locked --manifest-path tests/glib-variant/Cargo.toml
          CARGO_PROFILE_TEST_OPT_LEVEL=2 cargo test --locked --manifest-path tests/glib-variant/Cargo.toml
      - name: Rust 테스트·lint
        run: |
          # The desktop shell (crate project-o) needs WebView system libraries that the Linux
          # image lacks; the windows job below builds and tests it.
          # Every failing test binary is reported, not only the first.
          cargo test --workspace --exclude project-o --no-fail-fast
          cargo clippy --workspace --all-targets --exclude project-o -- -D warnings
      - name: 화면 로직 테스트·타입 검사
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app
          npm test
          npm run check
          npx tsc --noEmit -p app

  # The Windows build: the Tauri shell (project-o) and the Windows-only code (job objects,
  # process containment, the fake-provider runner tests) compile and run only here.
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        # bash stops at the first failing command; the pwsh wrapper only checks the last one.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: 화면 빌드 (Tauri 크레이트가 app/dist를 싣는다)
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app
          npm run build --prefix app
      - name: Rust 테스트 (Windows, 데스크톱 셸 포함)
        run: cargo test --workspace --no-fail-fast
      - name: Rust lint (Windows, 데스크톱 셸 포함)
        run: cargo clippy --workspace --all-targets -- -D warnings
