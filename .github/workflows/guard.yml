name: guard

on:
  pull_request:
  push:
    branches: [test_1, test_2, younchan, yongwoo]

# Read-only token: these jobs only check out and inspect.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 프로바이더 정책 검사 (o scan)
        run: cargo run --quiet --release -p o-cli -- scan --all
      - name: Rust 테스트·lint
        run: |
          # The desktop shell (crate project-o) needs WebView system libraries that the CI image lacks.
          cargo test --workspace --release --exclude project-o
          cargo clippy --workspace --release --exclude project-o -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 화면 로직 테스트·타입 검사
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app
          npm test
          npm run check
          npx tsc --noEmit -p app
