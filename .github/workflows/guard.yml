name: guard

on:
  pull_request:
  push:
    branches: [test, younchan, yongwoo]

# Read-only token: these jobs only check out and inspect.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 프로바이더 정책 검사
        run: node src/guard/scan.ts --all
      - name: 테스트
        run: npm test
      - name: 타입 검사 (O CLI·앱)
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app
          npm run check
          npx tsc --noEmit -p app
