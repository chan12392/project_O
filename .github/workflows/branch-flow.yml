name: branch-flow

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: PR 방향 검사
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          # Keep in sync with PERSONAL_BRANCHES in src/guard/hook.ts.
          PERSONAL: "younchan yongwoo"
        run: |
          fail() { echo "::error::$1 (head=$HEAD, base=$BASE). AGENTS.md의 병합 흐름을 확인하세요."; exit 1; }
          is_personal() { for p in $PERSONAL; do [ "$1" = "$p" ] && return 0; done; return 1; }
          if [ "$BASE" = "main" ]; then
            [ "$HEAD" = "test" ] || fail "main에는 test만 병합할 수 있습니다"
          elif [ "$BASE" = "test" ]; then
            is_personal "$HEAD" || fail "test에는 개인 브랜치($PERSONAL)만 병합할 수 있습니다"
          elif is_personal "$BASE"; then
            case "$HEAD" in
              main) ;;  # main 동기화
              "$BASE"-*/*|*/*) fail "작업 브랜치 이름에는 /를 쓰지 않습니다" ;;
              "$BASE"-*) ;;
              *) fail "$BASE에는 $BASE-<주제> 브랜치만 병합할 수 있습니다" ;;
            esac
          else
            fail "PR 대상은 main, test, 개인 브랜치($PERSONAL) 중 하나여야 합니다"
          fi
          echo "ok: $HEAD -> $BASE"
