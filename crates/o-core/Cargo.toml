[package]
name = "o-core"
description = "O CLI core: plans, policy, provider launch and stream reading, run store and runner."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
o-guard = { path = "../o-guard" }
chrono.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
# Key order as written: events, plans and tool summaries keep the order the TS port wrote.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "lead"
# Its own main: the test binary doubles as the fake lead CLI (see tests/lead.rs).
harness = false

[[test]]
name = "runner"
# Its own main: the test binary doubles as the fake provider CLI (see tests/runner.rs).
harness = false

[[test]]
name = "fallback_runner"
# This binary answers fixture metadata requests without calling real provider CLIs.
harness = false

[[test]]
name = "windows_native_launch"
harness = false

[[test]]
name = "codex_sandbox"
# Its own main: the test binary doubles as the fake Codex (see tests/codex_sandbox.rs).
harness = false

[[test]]
name = "macos_resource_probe"
path = "../../scripts/macos-resource-probe.rs"
